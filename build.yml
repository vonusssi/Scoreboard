name: Build APK
   on: [push]
   jobs:
     build-android:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Install dependencies
           run: |
             sudo apt update
             sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
             pip install --user --upgrade Cython==0.29.33 virtualenv buildozer
             export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
             yes | buildozer -v android debug
         - name: Upload APK
           uses: actions/upload-artifact@v4
           with:
             name: package
             path: bin/*.apk